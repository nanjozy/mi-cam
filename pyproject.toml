[project]
name = "miloco-sdk"
version = "0.1.0"
description = "Xiaomi Miloco SDK for Python"
readme = "README.md"
authors = [
    {name = "Xiaomi Corporation"}
]
requires-python = ">=3.12,<4.0"
license = {text = "Xiaomi Miloco License Agreement"}
keywords = ["xiaomi", "miloco", "sdk", "iot", "camera"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "qrcode==8.2",
    "fastmcp>=2.14.1",
    "openai>=1.0.0",
    "aiohttp>=3.8.0",
    "aiofiles>=23.0.0",
    "cryptography>=3.4.0",
    "av==16.0.1",
    "Pillow>=9.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "numpy (>=2.4.0,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "aiocache (>=0.12.3,<0.13.0)",
]

[tool.poetry]
package-mode = false